<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Can I Be Yours?</title>
    
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* iOS Touch & Layout Optimizations */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            background-color: #f0f7ff; /* Soft pastel blue background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e293b;
        }

        .main-container {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simple, clean white card with subtle soft shadow */
        .card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 1.75rem;
            text-align: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Smooth spring transition for "Yes" button growth */
        .btn-yes {
            background-color: #2563eb;
            color: #ffffff;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
        }

        .btn-yes:active {
            background-color: #1d4ed8;
        }

        /* Clean "No" button style */
        .btn-no {
            background-color: #e2e8f0;
            color: #475569;
            transition: left 0.25s ease-out, top 0.25s ease-out, background-color 0.2s ease;
        }

        .btn-no:active {
            background-color: #cbd5e1;
        }

        /* Subtle fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

    <main class="main-container">
        
        <!-- Interactive Question Card -->
        <div id="questionCard" class="card fade-in">
            <!-- Main Question Heading -->
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight mb-8">
                Can I Be Yours?
            </h1>

            <!-- Buttons Area -->
            <div id="buttonArea" class="flex items-center justify-center gap-4 relative min-h-[140px] w-full">
                
                <!-- Yes Button -->
                <button id="yesBtn" 
                        onclick="handleYesClick()" 
                        class="btn-yes font-semibold px-7 py-3 rounded-xl text-base shadow-sm z-10">
                    Yes
                </button>

                <!-- No Button -->
                <button id="noBtn" 
                        onpointerdown="moveNoButton(event)" 
                        onmouseover="moveNoButton(event)" 
                        onclick="moveNoButton(event)"
                        class="btn-no font-medium px-6 py-3 rounded-xl text-base z-10">
                    No
                </button>

            </div>
        </div>

        <!-- Success Screen (Hidden by default) -->
        <div id="successCard" class="card hidden flex-col items-center justify-between">
            <div class="my-auto py-2">
                <!-- Main Confession Text -->
                <p class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug tracking-tight">
                    "Doesn't have to be right now, I'll wait for you as long as it takes. This is my confession, better now than never."
                </p>
            </div>

            <!-- Sub Note -->
            <div class="w-full pt-6 mt-6 border-t border-slate-100">
                <p class="text-sm font-medium text-blue-600">
                    Tell when Reid is officially Seanora's.
                </p>
            </div>
        </div>

    </main>

    <script>
        let yesScale = 1;
        let isMoving = false;

        function moveNoButton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // 1. Grow the "Yes" button
            yesScale += 0.22;
            yesBtn.style.transform = `scale(${yesScale})`;

            // 2. Set "No" button to fixed positioning after first touch/hover so it can move anywhere safely
            if (!isMoving) {
                noBtn.style.position = 'fixed';
                isMoving = true;
            }

            // 3. Calculate safe padding so the button stays fully visible on mobile screens
            const padding = 24;
            const btnWidth = noBtn.offsetWidth || 80;
            const btnHeight = noBtn.offsetHeight || 44;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        function handleYesClick() {
            const questionCard = document.getElementById('questionCard');
            const successCard = document.getElementById('successCard');

            // Smooth transition to confession card
            questionCard.style.opacity = '0';
            questionCard.style.transform = 'scale(0.95)';

            setTimeout(() => {
                questionCard.classList.add('hidden');
                successCard.classList.remove('hidden');
                successCard.classList.add('flex', 'fade-in');
            }, 300);
        }
    </script>
</body>
</html>
